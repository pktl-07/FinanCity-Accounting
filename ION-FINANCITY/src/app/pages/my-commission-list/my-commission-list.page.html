<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title size="small">
      My Commission
    </ion-title>
    <ion-buttons slot="end">
      <fc-notification-summary></fc-notification-summary>
    </ion-buttons>
  </ion-toolbar>
  <fc-filter-toolbar [connector]="_filterConnectorService">
    <fc-filter-composite title="My Commission Filter">
      <fc-filter-item field="TransactionNo" label="Transaction No." type="text"></fc-filter-item>
      <fc-filter-item field="TransactionDate" label="Transaction Date" type="date"></fc-filter-item>
      <fc-filter-item field="PropertyAddress" label="Property Address" type="text"></fc-filter-item>
      <fc-filter-item field="LoanAmount" label="Loan Amount" type="currency"></fc-filter-item>
      <fc-filter-item field="ClientName" label="Client Name" type="text"></fc-filter-item>
      <fc-filter-item field="Bank" label="Bank" type="text"></fc-filter-item>
      <fc-filter-item field="CommissionAmount" label="Commission Amount" type="currency"></fc-filter-item>
      <fc-filter-item field="Status" label="Status" [items]="status" value="value" text="text" type="dropdown">
      </fc-filter-item>
    </fc-filter-composite>
  </fc-filter-toolbar>
</ion-header>
<ion-content>
  <fc-pager-container [data]="_dataListService" method="getSalespersonCommissionPager" #pagerContainer
    [connector]="_filterConnectorService">
    <fc-card (click)="onViewDetail($event)">
      <fc-card-header field="TransactionNo" icon="chart">
        <ng-template fcCardHeaderTemplate let-dataItem="dataItem">
          <fc-payable-status [value]="dataItem.Status"></fc-payable-status>
        </ng-template>
      </fc-card-header>
      <fc-card-item>
        <ng-template fcCardItemTemplate let-dataItem="dataItem">
          <ion-item lines="none">
            <ion-text slot="start" class="text-muted">{{ dataItem.ClientName }}</ion-text>
            <ion-text slot="end" class="text-muted">{{ dataItem.GrossComm | currency }}</ion-text>
          </ion-item>
        </ng-template>
      </fc-card-item>
    </fc-card>
  </fc-pager-container>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-text class="text-muted ion-padding" slot="end">
      {{pagerContainer.recordInfoSubject | async}}
    </ion-text>
  </ion-toolbar>
</ion-footer>
