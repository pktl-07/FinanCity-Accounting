<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      <span class="text-header">Change My Password</span>
    </ion-title>
    <ion-buttons slot="end">
      <fc-notification-summary></fc-notification-summary>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Current Password</ion-label>
        <ion-input formControlName="CurrentPassword" type="password"></ion-input>
        <fc-validation-container [control]="form?.get('CurrentPassword')" label="Current Password">
          <fc-validation-required></fc-validation-required>
          <fc-validation-minlength message="length must be more than 6."></fc-validation-minlength>
        </fc-validation-container>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">New Password</ion-label>
        <ion-input formControlName="NewPassword" type="password"></ion-input>
        <fc-validation-container [control]="form?.get('NewPassword')" label="New Password">
          <fc-validation-required></fc-validation-required>
          <fc-validation-minlength message="length must be more than 6."></fc-validation-minlength>
        </fc-validation-container>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Confirm Password</ion-label>
        <ion-input formControlName="ConfirmPassword" type="password"></ion-input>
        <fc-validation-container [control]="form?.get('ConfirmPassword')" label="Confirm Password">
          <fc-validation-required></fc-validation-required>
          <fc-validation-minlength message="length must be more than 6."></fc-validation-minlength>
        </fc-validation-container>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-button [disabled]="!form.valid" expand="block" color="success" (click)="handleOk()">OK</ion-button>
  </ion-toolbar>
</ion-footer>
