<ion-header>
    <ion-toolbar>
        <ion-title size="small">
            Vendor Information
        </ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="handleClose()" color="primary">
                Close
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<ion-content>
    <fc-company [form]="form.get('Vendor')"></fc-company>
    <ion-item-divider color="primary">
        <ion-label>
            Contact Information
        </ion-label>
    </ion-item-divider>
    <fc-contact [form]="form.get('Contact')"></fc-contact>
</ion-content>
<ion-footer>
    <ion-toolbar>
        <ion-button [disabled]="!form.valid" [disabled]="!form.valid" expand="block" color="success"
            (click)="handleOk()">OK</ion-button>
    </ion-toolbar>
</ion-footer>
