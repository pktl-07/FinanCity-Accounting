<form [formGroup]="formGroup">
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Salesperson Name</label>
            <input type="text" kendoTextBox class="form-control" formControlName="SalespersonName" readonly pInputIcon>
        </div>
        <div class="col-md-6 form-group">
            <label>Bank Name</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankAccountName" readonly pInputIcon>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>NRIC No.</label>
            <input type="text" kendoTextBox class="form-control" formControlName="NRIC" readonly pInputIcon>
        </div>
        <div class="col-md-6 form-group">
            <label>Bank Account No.</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankAccountNo" readonly pInputIcon>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Company Name</label>
            <input type="text" kendoTextBox class="form-control" formControlName="CompanyName" readonly pInputIcon>
        </div>
        <div class="col-md-6 form-group">
            <label>Pay Now</label>
            <input type="text" kendoTextBox class="form-control" formControlName="PayNow" readonly pInputIcon>
        </div>
    </div>
</form>
