<div [formGroup]='formGroup'>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Transaction Type</label>
            <div class="form-control">
                <ng-container *ngFor="let t of _transactoinType">
                    <label class="radio-inline" style="font-weight: normal">
                        <input type="radio" name="TransactionTypeSK" [value]="t.SysKey"
                            formControlName="TransactionTypeSK">&nbsp;{{t.Description}}
                    </label>&nbsp;&nbsp;
                </ng-container>
            </div>
        </div>
        <div class="col-md-6 form-group" *ngIf="formGroup?.get('TransactionTypeSK')?.value == '2017042514462609135'">
            <label>Construction Status</label>
            <div class="form-control">
                <label class="radio-inline" style="font-weight: normal">
                    <input type="radio" name="TransactionTypeCompleteStatus" [value]="true"
                        formControlName="TransactionTypeCompleteStatus">&nbsp;COMPLETED
                </label>&nbsp;&nbsp;
                <label class="radio-inline" style="font-weight: normal">
                    <input type="radio" name="TransactionTypeCompleteStatus" [value]="false"
                        formControlName="TransactionTypeCompleteStatus">&nbsp;UN-COMPLETED&nbsp;&nbsp;
                </label>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Property Type</label>
            <div class="form-control">
                <ng-container *ngFor="let t of _propertyType">
                    <label class="radio-inline" style="font-weight: normal">
                        <input type="radio" name="PropertyTypeSK" [value]="t.SysKey"
                            formControlName="PropertyTypeSK">&nbsp;{{t.Description}}
                    </label>&nbsp;&nbsp;
                </ng-container>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Property Purpose</label>
            <div class="form-control">
                <ng-container *ngFor="let t of _propertyPurpose">
                    <label class="radio-inline" style="font-weight: normal">
                        <input type="radio" name="PropertyPurposeSK" [value]="t.SysKey"
                            formControlName="PropertyPurposeSK">&nbsp;{{t.Description}}
                    </label>&nbsp;&nbsp;
                </ng-container>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header text-white">
            Loan Terms
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Interest Rate Type</label>
                    <div class="form-control">
                        <ng-container *ngFor="let t of _interestRateType">
                            <label class="radio-inline" style="font-weight: normal">
                                <input type="radio" name="InterestRateTypeSK" [value]="t.SysKey"
                                    formControlName="InterestRateTypeSK">&nbsp;{{t.Description}}
                            </label>&nbsp;&nbsp;
                        </ng-container>
                    </div>
                </div>
                <div class="col-md-6 form-group">
                    <label>Duration</label>
                    <kendo-dropdownlist class="form-control" [data]="_tncDurationService | async"
                        [valueField]="'SysKey'" [textField]="'Description'" [defaultItem]="_defaultItem"
                        [valuePrimitive]="true" formControlName="InterestRateTypeDurationSK">
                    </kendo-dropdownlist>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Rate Type</label>
                    <div class="form-control">
                        <ng-container *ngFor="let t of _rateType">
                            <label class="radio-inline" style="font-weight: normal">
                                <input type="radio" name="RateTypeSK" [value]="t.SysKey"
                                    formControlName="RateTypeSK">&nbsp;{{t.Description}}
                            </label>&nbsp;&nbsp;
                        </ng-container>
                    </div>
                </div>
                <div class="col-md-3 form-group">
                    <label>Time Frame</label>
                    <kendo-dropdownlist class="form-control" [data]="_tncTimeFrameService | async"
                        [valueField]="'SysKey'" [textField]="'Description'" [defaultItem]="_defaultItem"
                        [valuePrimitive]="true" formControlName="RateTypeTimeFrameSK">
                    </kendo-dropdownlist>
                </div>
                <div class="col-md-3 form-group">
                    <label>Rate/Spread/Margin (%)</label>
                    <kendo-numerictextbox formControlName="RateTypeMargin" class="form-control" min="0" max="100"
                        [format]="'n4'" [spinners]="false">
                    </kendo-numerictextbox>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Loan Amount</label>
                    <kendo-numerictextbox formControlName="LoanAmount" class="form-control" min="0" [format]="'c2'"
                        [readonly]="readonly" pInputIcon [iconVisible]="readonly" [spinners]="false">
                    </kendo-numerictextbox>
                </div>
                <div class="col-md-6 form-group">
                    <label>Loan Tenure (Years)</label>
                    <kendo-numerictextbox formControlName="LoanTenure" class="form-control" min="0" [spinners]="false">
                    </kendo-numerictextbox>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Lock-In Period (Months)</label>
                    <kendo-numerictextbox formControlName="LookInPeriod" class="form-control" min="0"
                        [spinners]="false">
                    </kendo-numerictextbox>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5" style="height: 300px;">
        <app-promotion-item-expense [formGroup]="formGroup" #expenseComponent></app-promotion-item-expense>
    </div>

    <div class="card mt-3">
        <div class="card-header text-white">
            Others
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 form-group">
                    <label>Legal Subsidy</label>
                    <div class="form-group">
                        <kendo-switch class="form-check-input" [onLabel]="'Yes'" [offLabel]="'No'"
                            formControlName="LegalSubsidy">
                        </kendo-switch>
                    </div>
                </div>
                <div class="col-md-3 form-group">
                    <label>Valuation Subsidy</label>
                    <div class="form-group">
                        <kendo-switch class="form-check-input" [onLabel]="'Yes'" [offLabel]="'No'"
                            formControlName="ValuationSubsidy">
                        </kendo-switch>
                    </div>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-6 form-group">
                    <label>Other Promotion</label>
                    <div class="form-group">
                        <textarea type="text" class="form-control" formControlName="OtherPromotion" rows="5"></textarea>
                    </div>
                </div>
                <div class="col-md-6 form-group">
                    <label>Remarks</label>
                    <div class="form-group">
                        <textarea type="text" class="form-control" formControlName="Remark" rows="5"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
