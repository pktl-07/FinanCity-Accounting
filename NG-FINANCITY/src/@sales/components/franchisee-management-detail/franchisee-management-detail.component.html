<p-modal-form [loading]="!formReady.value.ready">
  <ng-template fcModalContentTemplate>
    <kendo-tabstrip style="height: 100%;" *ngIf="formReady.value.ready">
      <kendo-tabstrip-tab [title]="'Vendor Information'" [selected]="true">
        <ng-template kendoTabContent>
          <div [formGroup]="form">
            <div formGroupName="Vendor">
              <!--unless put condition check the R1 and ContactPerson fields are blank. We dont know why?? -->
              <div class="row" *ngIf="form?.get('Vendor')?.get('R1')">
                <div class="form-group col-md-6">
                  <label>Franchisee No.</label>
                  <input type="text" kendoTextBox class="form-control" formControlName="R1" readonly>
                </div>
                <div class="form-group col-md-6">
                  <label>Contact Person</label>
                  <input type="text" kendoTextBox class="form-control" formControlName="ContactPerson">
                </div>
              </div>
              <div class="row">
                <div class="form-group col-md-6">
                  <label>Company Name</label>
                  <input type="text" kendoTextBox class="form-control" formControlName="CompanyName"
                    [ngClass]="{'is-invalid':form.get('Vendor').get('CompanyName').errors 
                        && (form.get('Vendor').get('CompanyName').touched || form.get('Vendor').get('CompanyName').dirty)}">
                  <div class="text-danger"
                    *ngIf="form.get('Vendor').get('CompanyName').hasError('required')
                                 && (form.get('Vendor').get('CompanyName').touched || form.get('Vendor').get('CompanyName').dirty)">
                    'Company Name' is required.
                  </div>
                </div>
                <div class="form-group col-md-6">
                  <label>Open Date</label>
                  <p-custom-kendo-date-picker formControlName="OpenDate"></p-custom-kendo-date-picker>
                </div>
              </div>
              <div class="row">
                <div class="form-group col-md-6">
                  <label>Company Registration Number</label>
                  <input type="text" kendoTextBox class="form-control" formControlName="CompanyReg" [ngClass]="{'is-invalid':form.get('Vendor').get('CompanyReg').errors 
                    && (form.get('Vendor').get('CompanyReg').touched || form.get('Vendor').get('CompanyReg').dirty)}">
                  <div class="text-danger"
                    *ngIf="form.get('Vendor').get('CompanyReg').hasError('required')
                             && (form.get('Vendor').get('CompanyReg').touched || form.get('Vendor').get('CompanyReg').dirty)">
                    'Company Registration Number' is required.
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 form-group">
                  <label>Is GST Registered?</label>
                  <div class="form-group">
                    <kendo-switch class="form-check-input" [onLabel]="'Yes'" [offLabel]="'No'" formControlName="IsGST">
                    </kendo-switch>
                  </div>
                </div>
                <!-- <div class="col-md-6 form-group">
                    <label>Company GST</label>
                    <kendo-dropdownlist class="form-control" [data]="_tax | async" [valueField]="'SysKey'"
                      [disabled]="form?.get('Vendor')?.get('IsGST')?.value == false"
                      [defaultItem]="{ SysKey : null , TaxCode : 'N/A' }" [kendoDropDownFilter]="filterSettings"
                      [textField]="'TaxCode'" [valuePrimitive]="true" formControlName="TaxSK">
                      <ng-template kendoDropDownListNoDataTemplate>
                        <div>
                          <button kendoButton [primary]="true" (click)="addNewTax()">Add New GST</button>
                        </div>
                      </ng-template>
                    </kendo-dropdownlist>
                    <div class="text-danger" *ngIf="form.get('Vendor').get('TaxSK').hasError('required')
                      && (form.get('Vendor').get('TaxSK').touched || form.get('Vendor').get('TaxSK').dirty)">
                      'Company GST' is required.
                    </div>
                  </div> -->
              </div>
              <div class="row mt-5">
                <div class="col-md-6 form-group">
                  <label>Is Active</label>
                  <div class="form-group">
                    <kendo-switch class="form-check-input" [onLabel]="'Yes'" [offLabel]="'No'"
                      formControlName="IsActive">
                    </kendo-switch>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </kendo-tabstrip-tab>
      <kendo-tabstrip-tab [title]="'Contact Information'">
        <ng-template kendoTabContent>
          <app-content-information [formGroup]="form?.get('Contact')"></app-content-information>
        </ng-template>
      </kendo-tabstrip-tab>
    </kendo-tabstrip>
  </ng-template>
</p-modal-form>
