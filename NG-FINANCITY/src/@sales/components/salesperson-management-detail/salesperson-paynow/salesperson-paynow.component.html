<div [formGroup]='formGroup'>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Mobile Number</label>
            <input type="text" kendoTextBox class="form-control" formControlName="MobileNumber">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>NRIC Number</label>
            <input type="text" kendoTextBox class="form-control" formControlName="NRIC">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>UEN Number</label>
            <input type="text" kendoTextBox class="form-control" formControlName="UEN">
        </div>
    </div>
</div>
