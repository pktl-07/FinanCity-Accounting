<div [formGroup]='formGroup'>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Bank Name</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankName">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Bank Branch Code</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankBranchCode">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Bank Account Name</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankAccountName">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 form-group">
            <label>Bank Account Number</label>
            <input type="text" kendoTextBox class="form-control" formControlName="BankAccountNo">
        </div>
    </div>
