<nav class="navbar navbar-expand navbar-light">
  <!--1 for home and 2 for arrow icon-->
  <ng-container [ngSwitch]="type">
    <ng-container *ngSwitchCase="1">
      <button type="button" class="btn bmt-btn-icon" (click)="do(getNavigateAction())">
        <i class="far fa-home-lg-alt gi-2x"></i>
      </button>
    </ng-container>
    <ng-container *ngSwitchCase="2">
      <button type="button" class="btn bmt-btn-icon" (click)="do(getNavigateAction())">
        <i class="fal fa-arrow-circle-left gi-2x"></i>
      </button>
    </ng-container>
    <ng-container *ngSwitchCase="3">
      <button type="button" class="btn bmt-btn-icon" (click)="do(getNavigateAction())">
        <i class="far fa-home-lg-alt gi-2x"></i>
      </button>
    </ng-container>
    <ng-container *ngSwitchCase="4">
      <button type="button" class="btn bmt-btn-icon" (click)="do(getNavigateAction())">
        <i class="far fa-home-lg-alt gi-2x"></i>
      </button>
    </ng-container>
    <ng-container *ngSwitchDefault>
      <button type="button" class="btn bmt-btn-icon" (click)="do(getNavigateAction())">
        <i class="far fa-home-lg-alt gi-2x"></i>
      </button>
    </ng-container>
  </ng-container>

  <!--heading text-->
  <span class="navbar-brand" style="margin-left: 10px">
    <h5>{{title}}</h5>
  </span>

  <!--1 for add button, 2 for more button-->
  <ng-container [ngSwitch]="type">

    <ng-container *ngSwitchCase="1">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <button type="button" class="btn bmt-btn-icon " (click)="do(getNavigateNewAction())">
            <i class="fal fa-plus gi-2x"></i>
          </button>
        </li>
      </ul>
    </ng-container>

    <ng-container *ngSwitchCase="2">
      <ul class="navbar-nav ml-auto">
        <div class="mt-3 w-100">
          <ng-template [ngIf]="statusTemplate?.templateRef" [ngTemplateOutlet]="statusTemplate?.templateRef">
          </ng-template>
        </div>
        <li class="nav-item" *ngIf="getExceptNavigateAction().length > 0">
          <div class="btn-group">
            <button class="btn bmt-btn-icon dropdown-toggle" type="button" id="triggerId" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              <i class="fas fa-bolt gi-2x"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="triggerId">
              <ng-container *ngFor="let b of getExceptNavigateAction()">
                <button class="dropdown-item gi-1x font-weight-bold " *ngIf="b?.disabled == false"
                  [class.hidden]="b?.disabled" (click)="do(b)">
                  <i class="w-25" [ngClass]="b.icon"></i>
                  {{b.label}}
                </button>
                <div class="dropdown-divider" *ngIf="b?.addSeperator"></div>
              </ng-container>
            </div>
          </div>
        </li>
      </ul>
    </ng-container>

    <ng-container *ngSwitchCase="3">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <div class="btn-group">
            <button class="btn bmt-btn-icon dropdown-toggle" type="button" id="triggerId" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              <i class="fas fa-bolt gi-2x"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="triggerId">
              <ng-container *ngFor="let b of getExceptNavigateAction()">
                <button class="dropdown-item" *ngIf="b?.disabled == false" [class.disabled]="b?.disabled"
                  (click)="do(b)">
                  <i [ngClass]="b.icon"></i>
                  {{b.label}}
                </button>
                <div class="dropdown-divider" *ngIf="b?.addSeperator"></div>
              </ng-container>
            </div>
          </div>
        </li>
      </ul>
    </ng-container>

    <ng-container *ngSwitchCase="4">
      <ul class="navbar-nav ml-auto">
        <div class="mt-3 w-100">
          <ng-template [ngIf]="statusTemplate?.templateRef" [ngTemplateOutlet]="statusTemplate?.templateRef">
          </ng-template>
        </div>
        <li class="nav-item" *ngIf="getExceptNavigateAction().length > 0">
          <div class="btn-group">
            <button class="btn bmt-btn-icon dropdown-toggle " type="button" id="triggerId" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              <i class="fas fa-bolt gi-2x"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="triggerId">
              <ng-container *ngFor="let b of getExceptNavigateAction()">
                <button class="dropdown-item gi-1x font-weight-bold " *ngIf="b?.disabled == false"
                  [class.hidden]="b?.disabled" (click)="do(b)">
                  <i class="w-25" [ngClass]="b.icon"></i>
                  {{b.label}}
                </button>
                <div class="dropdown-divider" *ngIf="b?.addSeperator"></div>
              </ng-container>
            </div>
          </div>
        </li>
      </ul>
    </ng-container>
    
  </ng-container>
</nav>
<confirm-dialog #confirmDialog></confirm-dialog>
