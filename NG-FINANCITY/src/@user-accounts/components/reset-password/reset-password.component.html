<div id="logreg-forms">
  <form class="form-signin" [formGroup]="formGroup">
    <h1 class="h3 mb-3 font-weight-normal" style="text-align: center">Change My Password</h1>
    <br>
    <input type="password" formControlName="NewPassword" class="form-control" placeholder="New Password" [ngClass]="{'is-invalid':formGroup?.get('NewPassword')?.errors 
     && (formGroup?.get('NewPassword')?.touched || formGroup?.get('NewPassword')?.dirty)}">
    <div class="text-danger" *ngIf="formGroup?.get('NewPassword')?.hasError('required') &&
           (formGroup?.get('NewPassword')?.touched || formGroup?.get('NewPassword')?.dirty)">
      'New Password' is required.
    </div>
    <div class="text-danger" *ngIf="formGroup?.get('NewPassword')?.hasError('minlength') &&
           (formGroup?.get('NewPassword')?.touched || formGroup?.get('NewPassword')?.dirty)">
      'New Password' length must be more than 6 characters.
    </div>
    <input type="password" formControlName="ConfirmPassword" class="form-control" placeholder="Confirm Password"
      [ngClass]="{'is-invalid':formGroup?.get('ConfirmPassword')?.errors 
     && (formGroup?.get('ConfirmPassword')?.touched || formGroup?.get('ConfirmPassword')?.dirty)}">
    <div class="text-danger" *ngIf="formGroup?.get('ConfirmPassword')?.hasError('required') &&
           (formGroup?.get('ConfirmPassword')?.touched || formGroup?.get('ConfirmPassword')?.dirty)">
      'Confirm Password' is required.
    </div>
    <div class="text-danger" *ngIf="formGroup?.get('ConfirmPassword')?.hasError('minlength') &&
           (formGroup?.get('ConfirmPassword')?.touched || formGroup?.get('ConfirmPassword')?.dirty)">
      'Confirm Password' length must be more than 6 characters.
    </div>
    <button class="btn btn-success btn-block mt-3" (click)="onChangePasswordClick()">
      <i class="fas fa-sign-in-alt"></i> Change Password
    </button>
  </form>
</div>
<confirm-dialog #confirmDialog></confirm-dialog>
